<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1f19" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#d9f7e3" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <!-- company logos are Google-served favicons — warm the connection early -->
    <link rel="preconnect" href="https://www.google.com" />
    <link rel="dns-prefetch" href="https://www.google.com" />
    <title>PlaceMate — Placement Cell Dashboard</title>
    <script>
      // Theme boot — runs before first paint (no flash). Dark first, like tvOS.
      (function () {
        try {
          var t = localStorage.getItem('pm-theme');
          if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.dataset.theme = t;
          var meta = document.querySelector('meta[name="theme-color"]:not([media])');
          if (!meta) {
            meta = document.createElement('meta');
            meta.name = 'theme-color';
            document.head.appendChild(meta);
          }
          meta.content = t === 'light' ? '#d9f7e3' : '#0f1f19';
        } catch (e) { /* stay dark */ }
      })();
    </script>
  </head>
  <body>
    <!-- Liquid glass refraction (Chromium backdrop-filter: url()).
         Recipes: WebTricks frost/rim/sheen + feTurbulence displacement
         (cssscript / kube.io). Safari/Firefox keep frost only. -->
    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute;overflow:hidden">
      <filter id="pm-liquid" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.007 0.008" numOctaves="2" seed="4" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="1.6" result="blurred" />
        <feDisplacementMap in="SourceGraphic" in2="blurred" scale="22" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="pm-liquid-hero" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.009 0.008" numOctaves="2" seed="92" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2" result="blurred" />
        <feDisplacementMap in="SourceGraphic" in2="blurred" scale="52" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <!-- Fluted (ribbed) glass: displacement varies sinusoidally along X
           only, constant down Y — a vertical flute profile. R encodes the
           X offset around neutral 128 (amplitude 60 → ±60px refraction at
           scale=1), G stays 128 (no Y shift), B 128, A opaque. -->
      <filter id="pm-fluted" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
        <feImage x="0" y="0" width="18" height="2" result="flute_tile"
          href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABIAAAACCAYAAABVGIzMAAAAMUlEQVR42mNoaGj4PxWIlwPxFiDeDcVboGIgOZCabCCOBGIfIHaFYh+oGEiOgVoGAQDnK1nd+PpEvQAAAABJRU5ErkJggg==" />
        <feTile in="flute_tile" result="flutes" />
        <feDisplacementMap in="SourceGraphic" in2="flutes" scale="1"
          xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
